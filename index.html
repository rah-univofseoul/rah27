<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R.A.H 제27회 정기공연 예매 · Enter the RAHDIUS</title>
<meta name="description" content="서울시립대학교 중앙스트릿댄스 동아리 R.A.H 제27회 정기공연 Enter the RAHDIUS 좌석 예매">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===== 색상 토큰 ===== */
:root{
  --bg:#E9ECF5; --surface:#FFFFFF; --ink:#15172B; --muted:#5A5F7A; --line:#CDD2E3;
  --cobalt:#2A3FD6; --cobalt-ink:#FFFFFF; --sticker:#FFD23F; --sticker-ink:#15172B;
  --seat:#FFFFFF; --seat-line:#9CA4C4; --taken:#C3C7D6; --danger:#C62E2E;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10122A; --surface:#1B1E3E; --ink:#ECEEFA; --muted:#A3A8C8; --line:#33385F;
    --cobalt:#4C5FF0; --cobalt-ink:#FFFFFF; --sticker:#FFD23F; --sticker-ink:#15172B;
    --seat:#252950; --seat-line:#5B628F; --taken:#3A3E62; --danger:#FF7A7A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10122A; --surface:#1B1E3E; --ink:#ECEEFA; --muted:#A3A8C8; --line:#33385F;
  --cobalt:#4C5FF0; --cobalt-ink:#FFFFFF; --sticker:#FFD23F; --sticker-ink:#15172B;
  --seat:#252950; --seat-line:#5B628F; --taken:#3A3E62; --danger:#FF7A7A;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.display{font-family:"Black Han Sans","Gothic A1","Apple SD Gothic Neo",sans-serif;font-weight:400;letter-spacing:-.01em}
.wrap{max-width:960px;margin:0 auto;padding:20px 18px 64px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sticker);outline-offset:2px}
.hidden{display:none!important}

/* 상단 바 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{font-size:22px;color:var(--ink);background:none;border:0;padding:0}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted)}
.steps li{padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.steps li.on{background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--cobalt)}
.notice{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--muted);margin-bottom:18px}

/* 메인: 포스터 + 정보 */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:32px;align-items:start}
@media (max-width:720px){.hero{grid-template-columns:1fr;gap:22px}}
.poster{position:relative;aspect-ratio:3/4;background:var(--cobalt);color:var(--cobalt-ink);border-radius:6px;overflow:hidden;padding:22px;display:flex;flex-direction:column;justify-content:space-between}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .big{font-size:clamp(84px,19vw,150px);line-height:.82;margin:0}
.poster .ord{position:absolute;right:-6px;top:38%;transform:rotate(-90deg);transform-origin:right top;font-size:clamp(56px,11vw,96px);line-height:1;color:var(--sticker)}
.poster .foot{font-size:14px;line-height:1.5;opacity:.92;max-width:70%}
.sticker{position:absolute;right:18px;bottom:20px;background:var(--sticker);color:var(--sticker-ink);font-weight:800;font-size:13px;padding:8px 12px;border-radius:4px;transform:rotate(-6deg)}
.info h1{font-size:clamp(36px,6.5vw,56px);line-height:1.05;margin:0 0 28px}
.info .sub{color:var(--muted);margin:0 0 8px;font-weight:600}
.facts{margin:0 0 24px;display:grid;grid-template-columns:auto 1fr;gap:10px 18px}
.facts dt{color:var(--muted);font-size:14px;padding-top:1px}
.facts dd{margin:0;font-weight:600;white-space:pre-line}
.lead{margin:0 0 26px;max-width:46ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:14px 26px;font-weight:800;font-size:17px;background:var(--cobalt);color:var(--cobalt-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 14px;font-size:14px}
.mine{margin-top:34px}
.mine h2{font-size:17px;margin:0 0 10px}
.mine-list{display:flex;flex-direction:column;gap:8px}
.mine-item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:14px}

/* 좌석 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.panel h2{margin:0 0 4px;font-size:22px}
.panel .hint{margin:0 0 18px;color:var(--muted);font-size:14px}
.stage{margin:0 auto 22px;max-width:520px;text-align:center;padding:8px;border-radius:0 0 60px 60px;background:var(--cobalt);color:var(--cobalt-ink);font-size:15px;letter-spacing:.3em}
.hall{overflow-x:auto;padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(7,var(--s)) 22px repeat(9,var(--s)) 22px repeat(11,var(--s));gap:4px 3px;justify-content:center;--s:clamp(22px,3vw,27px);min-width:max-content;margin:0 auto}
.foh{grid-column:9 / span 9;margin-top:14px;text-align:center;border:1.5px solid var(--seat-line);border-radius:4px;font-size:12px;letter-spacing:.3em;color:var(--muted);padding:4px}
.rowlab{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.seat{width:var(--s);height:var(--s);border-radius:6px 6px 3px 3px;border:1.5px solid var(--seat-line);background:var(--seat);color:var(--muted);font-size:10px;padding:0;display:flex;align-items:center;justify-content:center}
.seat:hover:not(:disabled){border-color:var(--cobalt)}
.seat.sel{background:var(--sticker);border-color:var(--sticker);color:var(--sticker-ink);font-weight:800}
.seat:disabled{background:var(--taken);border-color:var(--taken);color:transparent;cursor:not-allowed}
.gap{width:var(--s)}
.legend{display:flex;gap:18px;justify-content:center;margin:18px 0 0;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1.5px solid var(--seat-line);background:var(--seat)}
.legend i.s{background:var(--sticker);border-color:var(--sticker)}
.legend i.t{background:var(--taken);border-color:var(--taken)}
.bar{position:sticky;bottom:0;margin-top:20px;background:var(--surface);border-top:1px solid var(--line);padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar .sum{font-size:15px}
.bar .sum b{font-size:18px}
.bar .acts{display:flex;gap:8px}

/* 정보 입력 */
.form{display:grid;gap:16px;max-width:520px}
label.f{display:grid;gap:6px;font-weight:600;font-size:15px}
input[type=text],input[type=tel]{font:inherit;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{border-color:var(--cobalt);outline:none}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:1em}
.account{border:2px solid var(--cobalt);border-radius:10px;padding:16px;display:grid;gap:4px}
.account .num{font-size:20px;font-weight:800;word-break:break-all}
.account .amt{margin-top:6px}
.account .amt b{font-size:20px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.5}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--cobalt);flex:none}
.summary{font-size:14px;color:var(--muted)}

/* 티켓 */
.ticketwrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.ticket{width:min(100%,420px);background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.t-top{background:var(--cobalt);color:var(--cobalt-ink);padding:20px 22px}
.t-top .display{font-size:36px;line-height:1}
.t-top p{margin:6px 0 0;font-size:14px;opacity:.9}
.t-body{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.t-body div span{display:block;font-size:12px;color:var(--muted)}
.t-body div b{font-size:16px}
.t-body .wide{grid-column:1/-1}
.t-seats{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:28px!important;line-height:1.2}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 14px}
.t-stub{padding:14px 22px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.t-stub .code{font-family:"Black Han Sans",sans-serif;font-size:22px;letter-spacing:.06em}
.status{background:var(--sticker);color:var(--sticker-ink);font-size:12px;font-weight:800;padding:5px 10px;border-radius:4px}
.status.cancel{background:var(--danger);color:#fff}
.ticket{position:relative}
.ticket.canceled .t-seats,.ticket.canceled .code{text-decoration:line-through;opacity:.55}
.ticket .stamp{display:none}
.ticket.canceled .stamp{display:block;position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-14deg);border:4px solid var(--danger);color:var(--danger);font-family:"Black Han Sans",sans-serif;font-size:34px;padding:4px 18px;border-radius:6px;background:color-mix(in srgb,var(--surface) 70%,transparent);pointer-events:none;white-space:nowrap}
.mine-item .cx{color:var(--danger);font-weight:800}
.t-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.msg{font-size:14px;color:var(--muted);text-align:center;max-width:42ch;margin:0}

/* 관리자 */
.admin{margin-top:40px}
.admin table{width:100%;border-collapse:collapse;font-size:14px}
.admin th,.admin td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.admin .tbl{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){
  .ticket.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes pop{from{transform:translateY(16px) scale(.96);opacity:0}to{transform:none;opacity:1}}
}
.status.paid{background:#1E9E5A;color:#fff}
.mine-item .ok{color:#1E9E5A;font-weight:800}
.lookup{margin-top:30px}
.lookup h2{font-size:17px;margin:0 0 4px}
.lookup p{margin:0 0 10px}
.lk-row{display:flex;gap:8px;flex-wrap:wrap}
.lk-row input{flex:1 1 130px;min-width:0}
.lk-ok{color:var(--muted);font-size:13px;font-weight:600;min-height:1em}
.notice.error{border-style:solid;border-color:var(--danger);color:var(--danger)}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <button class="brand display" id="homeBtn" aria-label="처음 화면으로">R.A.H</button>
    <ol class="steps" id="steps" aria-label="예매 단계">
      <li data-s="seats">1 좌석</li><li data-s="info">2 정보·입금</li><li data-s="ticket">3 티켓</li>
    </ol>
  </header>
  <div class="notice error hidden" id="notice" role="alert"></div>

  <!-- 1. 메인 -->
  <section id="v-home">
    <div class="hero">
      <div class="poster" id="poster" aria-label="정기공연 포스터">
        <h2 class="big display">R.A.<br>H</h2>
        <div class="ord display">27th</div>
        <div class="foot" id="posterFoot"></div>
        <div class="sticker">Enter the RAHDIUS</div>
      </div>
      <div class="info">
        <p class="sub" id="subtitle"></p>
        <h1 class="display" id="title"></h1>
        <dl class="facts" id="facts"></dl>
        <button class="btn" id="startBtn">예매하기</button>
        <div class="mine hidden" id="mine">
          <h2>내 예매 내역</h2>
          <div class="mine-list" id="mineList"></div>
        </div>
        <div class="lookup">
          <h2>예매 내역 조회</h2>
          <p class="summary">다른 기기에서 예매했다면 예매자 성함과 전화번호로 찾을 수 있어요.</p>
          <div class="lk-row">
            <input type="text" id="lkName" placeholder="성함" autocomplete="name">
            <input type="tel" id="lkPhone" placeholder="010-1234-5678" inputmode="numeric" autocomplete="tel">
            <button class="btn ghost small" id="lkBtn" type="button">조회하기</button>
          </div>
          <div class="lk-ok" id="lkMsg"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 2. 좌석 선택 -->
  <section id="v-seats" class="hidden">
    <div class="panel">
      <h2>좌석 선택</h2>
      <p class="hint">좌석을 눌러 선택하세요. 휴대폰에서는 좌우로 밀어 전체 좌석을 볼 수 있어요.</p>
      <div class="stage">STAGE</div>
      <div class="hall"><div class="grid" id="grid"></div></div>
      <div class="legend"><span><i></i>선택 가능</span><span><i class="s"></i>선택한 좌석</span><span><i class="t"></i>예매 완료·선택 불가</span></div>
      <div class="bar">
        <div class="sum" id="seatSum">좌석 정보를 불러오는 중…</div>
        <div class="acts"><button class="btn ghost small" id="seatBack">이전</button><button class="btn small" id="seatNext" disabled>다음</button></div>
      </div>
    </div>
  </section>

  <!-- 3. 정보 입력 -->
  <section id="v-info" class="hidden">
    <div class="panel">
      <h2>예매자 정보와 입금</h2>
      <p class="hint summary" id="infoSummary"></p>
      <div class="form">
        <label class="f">성함<input type="text" id="name" autocomplete="name" placeholder="홍길동"></label>
        <label class="f">전화번호<input type="tel" id="phone" autocomplete="tel" inputmode="numeric" placeholder="010-1234-5678"></label>
        <div class="err" id="phoneErr"></div>
        <div class="account">
          <span class="summary">입금 계좌</span>
          <span class="num" id="accNum"></span>
          <span id="accHolder"></span>
          <div class="amt">입금하실 금액 <b id="amount"></b></div>
          <div><button class="btn ghost small" id="copyAcc" type="button">계좌번호 복사</button></div>
        </div>
        <p class="summary" style="margin:0">입금자명은 예매자 성함과 같게 해주세요. 입금이 확인되지 않으면 예매가 취소될 수 있어요.</p>
        <label class="check"><input type="checkbox" id="paid">위 계좌로 입금을 완료했어요.</label>
        <div class="err" id="bookErr"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn ghost" id="infoBack" type="button">좌석 다시 고르기</button>
          <button class="btn" id="bookBtn" type="button" disabled>예매 완료하기</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 4. 티켓 -->
  <section id="v-ticket" class="hidden">
    <div class="ticketwrap">
      <article class="ticket pop" id="ticket"></article>
      <div class="t-acts">
        <button class="btn" id="saveBtn">티켓 이미지 저장</button>
        <button class="btn ghost" id="doneBtn">처음으로</button>
      </div>
      <p class="msg" id="saveMsg"></p>
    </div>
  </section>
</div>

<script>
/* =========================================================
   ★ 1. 여기에 Apps Script 웹 앱 주소를 붙여넣으세요 ★
   ========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbzb_ltKG8V5RTBL7zH5bAHg7mqJ8rRqKCiEKNZUW1_qM-pWRLQfSTBzLHdL_cve5KBg/exec";

/* =========================================================
   2. 공연 정보 (바꾸면 사이트 전체에 반영돼요)
   ========================================================= */
const CONFIG = {
  title: "Enter the RAHDIUS",
  subtitle: "서울시립대학교 중앙스트릿댄스 동아리 R.A.H 제27회 정기공연",
  date: "2026년 11월 29일 (일)",
  time: "오후 5:00",
  venue: "예림당아트홀",
  address: "서울특별시 강남구 언주로 33",
  price: 8000,
  doorPrice: 10000,
  bank: "카카오뱅크",

/* ---------- 상태 ---------- */
const S = { view:"home", taken:new Set(), seatsLoaded:false, sel:[], mine:[], last:null };
const $ = id => document.getElementById(id);
const won = n => Number(n).toLocaleString("ko-KR") + "원";
const STATUS = {
  pending:  { label:"입금 확인 중",         cls:"",       bg:"#FFD23F", fg:"#15172B" },
  paid:     { label:"입금 완료",            cls:"paid",   bg:"#1E9E5A", fg:"#FFFFFF" },
  canceled: { label:"관리자에 의해 취소됨", cls:"cancel", bg:"#C62E2E", fg:"#FFFFFF" }
};
const st = t => STATUS[t.status] || STATUS.pending;

/* ---------- 서버 통신 ---------- */
async function api(action, data = {}){
  if (!API_URL.startsWith("https://")) throw new Error("예매 서버 주소가 아직 설정되지 않았어요. (index.html의 API_URL)");
  let res;
  try {
    res = await fetch(API_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ action, ...data }) });
  } catch { throw new Error("서버에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 시도하세요."); }
  let j;
  try { j = await res.json(); } catch { throw new Error("서버 응답을 읽지 못했어요. 잠시 후 다시 시도하세요."); }
  if (!j.ok){ const e = new Error(j.error || "요청을 처리하지 못했어요."); e.taken = j.taken || []; throw e; }
  return j;
}
function notice(msg){ $("notice").textContent = msg || ""; $("notice").classList.toggle("hidden", !msg); }

/* ---------- 이 기기에 저장된 내 티켓 ---------- */
function loadMine(){ try { S.mine = JSON.parse(localStorage.getItem("rah27-mine") || "[]"); } catch { S.mine = []; } }
function saveMine(){ try { localStorage.setItem("rah27-mine", JSON.stringify(S.mine)); } catch {} }
function upsert(t){
  const i = S.mine.findIndex(x => x.code === t.code);
  if (i < 0) S.mine.push(t); else S.mine[i] = { ...S.mine[i], ...t };
  S.mine.sort((a,b) => a.code < b.code ? -1 : 1);
  saveMine();
}
async function refreshMine(){
  if (!S.mine.length) return;
  try {
    const j = await api("mine", { items: S.mine.map(({code, token}) => ({code, token})) });
    j.tickets.forEach(upsert);
    if (S.view === "home") renderMine();
    if (S.view === "ticket" && S.last){
      const u = S.mine.find(x => x.code === S.last.code);
      if (u && u.status !== S.last.status){ S.last = u; renderTicket(u); }
    }
  } catch {}
}

/* ---------- 화면 ---------- */
function renderInfo(){
  $("title").textContent = CONFIG.title;
  $("subtitle").textContent = CONFIG.subtitle;
  $("posterFoot").textContent = CONFIG.date + "\n" + CONFIG.venue;
  $("posterFoot").style.whiteSpace = "pre-line";
  if (CONFIG.posterImage && CONFIG.posterImage.startsWith("data:")){
    $("poster").style.aspectRatio = "886 / 1258"; $("poster").style.background = "#000";
    const img = new Image(); img.src = CONFIG.posterImage; img.alt = "R.A.H 제27회 정기공연 포스터";
    $("poster").replaceChildren(img);
  }
  const facts = [["일시", CONFIG.date + " " + CONFIG.time],["장소", CONFIG.venue + "\n" + CONFIG.address],["관람료", "사전예매 " + won(CONFIG.price) + " · 현장예매 " + won(CONFIG.doorPrice)],["좌석", "1층 지정석"]];
  $("facts").replaceChildren(...facts.flatMap(([k,v]) => { const dt=document.createElement("dt"); dt.textContent=k; const dd=document.createElement("dd"); dd.textContent=v; return [dt,dd]; }));
  $("accNum").textContent = CONFIG.bank + " " + CONFIG.account;
  $("accHolder").textContent = CONFIG.holder;
}

let seatTimer = null;
function show(v){
  S.view = v;
  ["home","seats","info","ticket"].forEach(x => $("v-"+x).classList.toggle("hidden", x !== v));
  document.querySelectorAll("#steps li").forEach(li => li.classList.toggle("on", li.dataset.s === v));
  $("steps").classList.toggle("hidden", v === "home");
  clearInterval(seatTimer);
  if (v === "seats"){ renderGrid(); loadSeats(); seatTimer = setInterval(loadSeats, 15000); }
  if (v === "info") prepInfo();
  if (v === "home"){ renderMine(); refreshMine(); }
  window.scrollTo({ top:0 });
}

/* ---------- 좌석 ---------- */
async function loadSeats(){
  try {
    const j = await api("seats");
    S.taken = new Set(j.taken); S.seatsLoaded = true; notice("");
    if (S.view === "seats") renderGrid();
  } catch(e){ notice(e.message); if (!S.seatsLoaded) $("seatSum").textContent = "좌석 정보를 불러오지 못했어요"; }
}
function rowSeats(r){
  const s = new Set();
  for (let c=1;c<=7;c++) s.add(c);
  if (!CONFIG.noCenter.includes(r)) for (let c=8;c<=16;c++) s.add(c);
  const end = CONFIG.rightShort.includes(r) ? 25 : 27;
  for (let c=17;c<=end;c++) s.add(c);
  return s;
}
function renderGrid(){
  const g = $("grid"); g.replaceChildren();
  const label = r => { const l=document.createElement("div"); l.className="rowlab"; l.textContent=r; g.append(l); };
  for (const r of CONFIG.rows){
    const have = rowSeats(r);
    const cell = c => {
      if (!have.has(c)){ const e=document.createElement("div"); e.className="gap"; g.append(e); return; }
      const id = r+c, b = document.createElement("button");
      b.className="seat"; b.type="button"; b.textContent=c; b.dataset.id=id;
      const taken = !S.seatsLoaded || S.taken.has(id) || CONFIG.blocked.includes(id);
      b.disabled = taken;
      b.setAttribute("aria-label", r + "열 " + c + "번" + (taken ? " 선택 불가" : " 좌석"));
      if (S.sel.includes(id)){ b.classList.add("sel"); b.setAttribute("aria-pressed","true"); }
      b.onclick = () => toggleSeat(id);
      g.append(b);
    };
    for (let c=1;c<=7;c++) cell(c);
    label(r);
    for (let c=8;c<=16;c++) cell(c);
    label(r);
    for (let c=17;c<=27;c++) cell(c);
  }
  const foh = document.createElement("div"); foh.className="foh"; foh.textContent="FOH"; g.append(foh);
  updateSum();
}
function toggleSeat(id){
  S.sel = S.sel.includes(id) ? S.sel.filter(x => x !== id) : [...S.sel, id];
  renderGrid();
}
function sortSeats(a){ return [...a].sort((x,y) => x[0]===y[0] ? (+x.slice(1))-(+y.slice(1)) : x.localeCompare(y)); }
function updateSum(){
  S.sel = S.sel.filter(id => !S.taken.has(id));
  const n = S.sel.length, sum = $("seatSum");
  sum.replaceChildren();
  if (!S.seatsLoaded) sum.textContent = "좌석 정보를 불러오는 중…";
  else if (!n) sum.textContent = "좌석을 선택하세요";
  else { const s=document.createElement("span"); s.textContent = sortSeats(S.sel).join(", ") + " · "; const b=document.createElement("b"); b.textContent = won(n*CONFIG.price); sum.append(s,b); }
  $("seatNext").disabled = !n;
}

/* ---------- 정보 입력 ---------- */
function prepInfo(){
  $("infoSummary").textContent = "선택한 좌석: " + sortSeats(S.sel).join(", ") + " (" + S.sel.length + "매)";
  $("amount").textContent = won(S.sel.length*CONFIG.price);
  $("bookErr").textContent = "";
  validate();
}
function normPhone(v){ const d=v.replace(/\D/g,""); return d.length===11 ? d.replace(/(\d{3})(\d{4})(\d{4})/,"$1-$2-$3") : d.length===10 ? d.replace(/(\d{3})(\d{3})(\d{4})/,"$1-$2-$3") : v; }
function phoneOk(v){ return /^01[016789]\d{7,8}$/.test(v.replace(/\D/g,"")); }
function validate(){
  const p = $("phone").value.trim();
  $("phoneErr").textContent = p && !phoneOk(p) ? "전화번호를 010-0000-0000 형식으로 입력하세요" : "";
  $("bookBtn").disabled = !($("name").value.trim().length>=2 && phoneOk(p) && $("paid").checked && S.sel.length);
}
["name","phone","paid"].forEach(id => $(id).addEventListener("input", validate));
$("phone").addEventListener("blur", e => { e.target.value = normPhone(e.target.value); validate(); });
$("lkPhone").addEventListener("blur", e => { e.target.value = normPhone(e.target.value); });
$("copyAcc").onclick = async () => {
  try { await navigator.clipboard.writeText(CONFIG.account.replace(/-/g,"")); $("copyAcc").textContent="복사했어요"; }
  catch { $("copyAcc").textContent="직접 복사해 주세요"; }
  setTimeout(() => $("copyAcc").textContent="계좌번호 복사", 1800);
};

async function book(){
  $("bookBtn").disabled = true; $("bookBtn").textContent = "예매 중…"; $("bookErr").textContent = "";
  try {
    const j = await api("book", { name:$("name").value.trim(), phone:normPhone($("phone").value.trim()), seats:sortSeats(S.sel) });
    const t = j.ticket;
    upsert(t); S.last = t; S.sel = [];
    $("name").value=""; $("phone").value=""; $("paid").checked=false;
    renderTicket(t); show("ticket");
  } catch(e){
    $("bookErr").textContent = e.message;
    if (e.taken && e.taken.length){
      e.taken.forEach(s => S.taken.add(s));
      S.sel = S.sel.filter(s => !e.taken.includes(s));
      $("infoSummary").textContent = S.sel.length ? "남은 선택 좌석: " + sortSeats(S.sel).join(", ") : "좌석을 다시 골라주세요.";
      $("amount").textContent = won(S.sel.length*CONFIG.price);
    }
  } finally { $("bookBtn").textContent = "예매 완료하기"; validate(); }
}

/* ---------- 내 예매 / 조회 ---------- */
function renderMine(){
  $("mine").classList.toggle("hidden", !S.mine.length);
  $("mineList").replaceChildren(...S.mine.map(t => {
    const d=document.createElement("div"); d.className="mine-item";
    const s=document.createElement("span"); s.textContent = t.code + " · " + t.seats.join(", ");
    if (t.status==="canceled"){ const c=document.createElement("span"); c.className="cx"; c.textContent=" (취소된 티켓)"; s.append(c); }
    if (t.status==="paid"){ const c=document.createElement("span"); c.className="ok"; c.textContent=" (입금 완료)"; s.append(c); }
    const b=document.createElement("button"); b.className="btn ghost small"; b.textContent="티켓 보기";
    b.onclick = () => { S.last=t; renderTicket(t); show("ticket"); refreshMine(); };
    d.append(s,b); return d;
  }));
}
$("lkBtn").onclick = async () => {
  const name=$("lkName").value.trim(), phone=$("lkPhone").value.trim();
  if (!name || !phoneOk(phone)){ $("lkMsg").textContent = "성함과 전화번호를 정확히 입력하세요."; return; }
  $("lkBtn").disabled = true; $("lkMsg").textContent = "찾는 중…";
  try {
    const j = await api("lookup", { name, phone });
    j.tickets.forEach(upsert); renderMine();
    $("lkMsg").textContent = j.tickets.length ? j.tickets.length + "건을 찾았어요. 위 내 예매 내역에서 확인하세요." : "일치하는 예매가 없어요. 성함과 전화번호를 다시 확인하세요.";
  } catch(e){ $("lkMsg").textContent = e.message; }
  finally { $("lkBtn").disabled = false; }
};

/* ---------- 티켓 ---------- */
function maskPhone(p){ return String(p).replace(/(\d{3})-?(\d{3,4})-?(\d{4})/,"$1-****-$3"); }
function renderTicket(t){
  const el = $("ticket"); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  el.innerHTML = `
    <div class="t-top"><div class="display"></div><p></p></div>
    <div class="t-body">
      <div class="wide"><span>좌석</span><b class="t-seats"></b></div>
      <div><span>일시</span><b data-k="date"></b></div>
      <div><span>장소</span><b data-k="venue"></b></div>
      <div><span>예매자</span><b data-k="name"></b></div>
      <div><span>전화번호</span><b data-k="phone"></b></div>
      <div><span>매수</span><b data-k="cnt"></b></div>
      <div><span>금액</span><b data-k="amt"></b></div>
    </div>
    <div class="perf"></div>
    <div class="t-stub"><div><span class="summary" style="font-size:12px">예매번호</span><div class="code"></div></div><span class="status"></span></div>
    <div class="stamp">취소된 티켓</div>`;
  el.querySelector(".t-top .display").textContent = CONFIG.title;
  el.querySelector(".t-top p").textContent = CONFIG.subtitle;
  el.querySelector(".t-seats").textContent = t.seats.join("  ");
  const v = { date:CONFIG.date+" "+CONFIG.time, venue:CONFIG.venue, name:t.name, phone:maskPhone(t.phone), cnt:t.seats.length+"매", amt:won(t.amount) };
  el.querySelectorAll("[data-k]").forEach(b => b.textContent = v[b.dataset.k]);
  el.querySelector(".code").textContent = t.code;
  const s = st(t), badge = el.querySelector(".status");
  badge.textContent = s.label; if (s.cls) badge.classList.add(s.cls);
  el.classList.toggle("canceled", t.status === "canceled");
  $("saveMsg").textContent = t.status === "canceled"
    ? "이 티켓은 관리자에 의해 취소됐어요. 문의는 R.A.H로 연락해 주세요."
    : "공연 당일 입구에서 이 티켓과 예매번호를 보여주세요.";
}

async function ticketPng(t){
  try { await document.fonts.ready; } catch {}
  const W=840, H=1060, c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d"), F='"Gothic A1","Apple SD Gothic Neo",sans-serif', D='"Black Han Sans","Gothic A1",sans-serif';
  const r=(X,Y,w,h,rad,fill)=>{ x.beginPath(); if (x.roundRect) x.roundRect(X,Y,w,h,rad); else x.rect(X,Y,w,h); x.fillStyle=fill; x.fill(); };
  x.fillStyle="#E9ECF5"; x.fillRect(0,0,W,H);
  r(40,40,W-80,H-80,28,"#FFFFFF");
  x.fillStyle="#2A3FD6"; x.fillRect(40,68,W-80,212); r(40,40,W-80,60,28,"#2A3FD6");
  x.fillStyle="#FFFFFF"; x.font=`64px ${D}`; x.fillText(CONFIG.title,80,160,W-160);
  x.font=`600 24px ${F}`; x.globalAlpha=.9; x.fillText(CONFIG.subtitle,80,215,W-160); x.globalAlpha=1;
  x.fillStyle="#5A5F7A"; x.font=`600 24px ${F}`; x.fillText("좌석",80,340);
  x.fillStyle="#15172B"; x.font=`60px ${D}`; x.fillText(t.seats.join("  "),80,410,W-160);
  const items=[["일시",CONFIG.date],["시간",CONFIG.time],["장소",CONFIG.venue],["예매자",t.name],["전화번호",maskPhone(t.phone)],["매수 · 금액",t.seats.length+"매 · "+won(t.amount)]];
  items.forEach(([k,v],i)=>{ const y=490+i*66; x.fillStyle="#5A5F7A"; x.font=`600 22px ${F}`; x.fillText(k,80,y); x.fillStyle="#15172B"; x.font=`800 28px ${F}`; x.fillText(v,260,y,W-340); });
  x.setLineDash([14,10]); x.strokeStyle="#CDD2E3"; x.lineWidth=3; x.beginPath(); x.moveTo(70,890); x.lineTo(W-70,890); x.stroke(); x.setLineDash([]);
  x.fillStyle="#E9ECF5"; x.beginPath(); x.arc(40,890,22,0,Math.PI*2); x.arc(W-40,890,22,0,Math.PI*2); x.fill();
  x.fillStyle="#5A5F7A"; x.font=`600 22px ${F}`; x.fillText("예매번호",80,945);
  x.fillStyle="#15172B"; x.font=`48px ${D}`; x.fillText(t.code,80,1000);
  const s=st(t); x.font=`800 24px ${F}`; const bw=x.measureText(s.label).width+48;
  r(W-80-bw,950,bw,52,8,s.bg); x.fillStyle=s.fg; x.textAlign="center"; x.fillText(s.label,W-80-bw/2,985); x.textAlign="left";
  if (t.status==="canceled"){
    x.save(); x.translate(W/2,560); x.rotate(-0.25);
    x.fillStyle="rgba(255,255,255,.75)"; x.fillRect(-270,-75,540,150);
    x.strokeStyle="#C62E2E"; x.lineWidth=8; x.strokeRect(-270,-75,540,150);
    x.fillStyle="#C62E2E"; x.font=`88px ${D}`; x.textAlign="center"; x.textBaseline="middle"; x.fillText("취소된 티켓",0,6); x.restore();
  }
  return await new Promise(res => c.toBlob(res, "image/png"));
}
$("saveBtn").onclick = async () => {
  const t = S.last; if (!t) return;
  const blob = await ticketPng(t), name = "RAH27_티켓_" + t.code + ".png";
  const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  try {
    const file = new File([blob], name, { type:"image/png" });
    if (mobile && navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:"R.A.H 제27회 정기공연 티켓" });
      $("saveMsg").textContent = "공유 메뉴에서 '이미지 저장'을 고르면 사진첩에 저장돼요.";
      return;
    }
  } catch(e){ if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  $("saveMsg").textContent = "티켓 이미지를 저장했어요. 저장이 안 되면 이 화면을 캡처해 두세요.";
};

/* ---------- 버튼 ---------- */
$("startBtn").onclick = () => show("seats");
$("homeBtn").onclick = () => show("home");
$("seatBack").onclick = () => show("home");
$("seatNext").onclick = () => S.sel.length && show("info");
$("infoBack").onclick = () => show("seats");
$("bookBtn").onclick = book;
$("doneBtn").onclick = () => show("home");
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.view === "home") refreshMine(); });

/* ---------- 시작 ---------- */
renderInfo(); loadMine(); show("home");
if (!API_URL.startsWith("https://")) notice("예매 서버 주소가 아직 설정되지 않았어요. (index.html의 API_URL)");
</script>
</body>
